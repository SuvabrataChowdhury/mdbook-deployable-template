name: 🔧 Chore
description: Maintenance tasks like dependency updates, refactoring, or CI/CD improvements
title: "[CHORE] "
labels: ["chore"]

body:
  - type: markdown
    attributes:
      value: |
        Use this for maintenance tasks that don't add features or fix bugs.

  - type: dropdown
    id: category
    attributes:
      label: 🗂️ Chore Category
      description: What kind of maintenance task is this?
      options:
        - Dependency Update
        - Refactoring
        - CI/CD Improvement
        - Tooling/Configuration
        - Code Cleanup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: What needs to be done and why?
      placeholder: "We should update... because..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation
      description: Why is this maintenance work needed?
      placeholder: "This will improve... / The current version is outdated because..."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: ⚠️ Potential Impact
      description: Could this change affect anything else? Any risks?
      placeholder: "This may affect... / No user-facing changes expected."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I've searched for similar open issues
          required: true
        - label: This task has no user-facing feature changes
          required: false
        - label: I've considered the impact on existing workflows
          required: false
