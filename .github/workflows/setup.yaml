name: Init Repository
on:
  workflow_dispatch:
    inputs:
      book_title:
        description: 'Title of your book'
        required: true
      author_name:
        description: 'Your name as the author'
        required: true

jobs:
  initialize-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository Default Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set branch name
        run: echo "NEW_BRANCH=init-repo-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
      - name: Branch off for new changes
        run: |
          git checkout -b "$NEW_BRANCH"
      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.5.4
        run: |
          curl -sSL --fail "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv mdbook /usr/local/bin/
      - name: Make initial changes
        env:
          BOOK_TITLE: ${{ inputs.book_title }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          bash ./init.sh --title "$BOOK_TITLE" --author "$AUTHOR_NAME" --repo "$REPO_URL"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: initialize book - $BOOK_TITLE"
          git push -u origin "$NEW_BRANCH"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ env.NEW_BRANCH }}
          TG: ${{ github.event.repository.default_branch }}
          BOOK_TITLE: ${{ inputs.book_title }}
          AUTHOR_NAME: ${{ inputs.author_name }}
        run: |
          cat > /tmp/pr_body.md << PREOF
          ## Initialize repository

          This PR was generated by the **Init Repository** workflow.

          It sets up your mdBook project with the following configuration:
          - **Title**: $BOOK_TITLE
          - **Author**: $AUTHOR_NAME

          ### What changed
          - Initialized \`book.toml\` with your book title, author, and repository URL
          - Set up the \`src/\` directory with a starter page
          - Applied the default theme
          - Updated issue and pull request templates

          ### Next steps
          1. Review the changes in this PR.
          2. Merge when ready — the deploy workflow will automatically build and publish your book to GitHub Pages.
          3. Clone or pull the latest changes locally to start writing.
          PREOF

          echo "🚀 Creating pull request..."
          gh pr create \
            --title "chore: initialize book $BOOK_TITLE by $AUTHOR_NAME" \
            --body-file /tmp/pr_body.md \
            --base "$TG" \
            --head "$SRC"
