name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check-pr-title:
    if: github.actor != 'github-actions[bot]'
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            chore
          scopes: |
            script
            doc
            ci
          requireScope: true
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
  skip-for-bot:
    if: github.actor == 'github-actions[bot]'
    name: Skip for bot PRs
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Skipping lint for bot PR" 

