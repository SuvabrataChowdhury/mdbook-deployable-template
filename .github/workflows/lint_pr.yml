name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Title Format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES_PATTERN="feat|fix|chore"
          SCOPES_PATTERN="script|doc|ci"

          # Regex pattern for Conventional Commits
          # Matches: feat: description, fix(scope): description, chore!: description
          REGEX="^($TYPES_PATTERN)(\($SCOPES_PATTERN\))?!?: .+$"

          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "::error title=Invalid PR Title::The PR title '$PR_TITLE' is not valid."
            echo "Please use the format: <type>(<scope>): <description>"
            echo "Example: feat(script): added new mdbook plugin"
            exit 1
          fi

          echo "PR title is valid!"
